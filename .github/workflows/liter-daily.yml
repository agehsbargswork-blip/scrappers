name: Literature opportunity monitor

on:
  pull_request:
    paths:
      - "liter/**"
      - ".github/workflows/liter-daily.yml"
  workflow_dispatch:
    inputs:
      scheduled_run:
        description: "Treat this dispatch as a daily scheduled attempt"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "41 15 * * *"
      timezone: "Etc/UTC"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: liter/requirements.txt
      - run: python -m pip install --requirement liter/requirements.txt
      - run: python -m compileall -q liter/src
      - run: python -m unittest discover -s liter/tests

  monitor:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: literature-monitor
      queue: max
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      GOOGLE_SPREADSHEET_ID: ${{ vars.GOOGLE_SPREADSHEET_ID || '18vAZy_ftbN9wXRuwcXPUzrlTO8wHlGsUlzEppEO3Jok' }}
      GOOGLE_SHEET_NAME: ${{ vars.GOOGLE_SHEET_NAME || 'Sheet1' }}
      FETCH_WORKERS: ${{ vars.FETCH_WORKERS || '8' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: liter/requirements.txt
      - run: python -m pip install --requirement liter/requirements.txt
      - name: Restore site hash cache
        uses: actions/cache/restore@v6
        with:
          path: liter/.cache
          key: liter-site-hashes-v2-${{ github.run_id }}
          restore-keys: |
            liter-site-hashes-v2-
      - name: Check sites and update Google Sheet
        id: monitor
        continue-on-error: true
        run: >-
          python liter/src/check_sites.py
          ${{ (github.event_name == 'schedule' || inputs.scheduled_run) && '--scheduled' || '' }}
      - name: Save site hash cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: liter/.cache
          key: liter-site-hashes-v2-${{ github.run_id }}
      - name: Preserve monitor failure status
        if: steps.monitor.outcome == 'failure'
        run: exit 1
